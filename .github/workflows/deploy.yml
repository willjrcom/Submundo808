name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: submundo-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish GHCR
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: submundo_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: submundo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U submundo_ci -d submundo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Auditoria incremental: reportar débitos legados sem quebrar o POC atual.
      - name: Audit frontend types (baseline)
        continue-on-error: true
        run: pnpm --filter @workspace/submundo-808 typecheck

      - name: Run critical regression tests
        run: node --test tests/auth.test.mjs tests/request-security.test.mjs tests/location-sharing.test.mjs tests/demo-auto-seed.test.mjs tests/notification-delivery.test.mjs tests/health.test.mjs tests/accent-contrast.test.mjs tests/notification-map-focus.test.mjs tests/security-ops.test.mjs tests/privacy-notices.test.mjs tests/postgres-sync.test.mjs tests/real-tour-reset.test.mjs tests/real-tour-seed.test.mjs tests/public-event-navigation.test.mjs

      - name: Audit full test suite (baseline)
        continue-on-error: true
        run: node --test tests/*.test.mjs

      - name: Check backend syntax
        run: |
          node --check server/index.mjs
          node --check server/auth.mjs
          node --check server/request-security.mjs
          node --check server/oauth.mjs
          node --check server/health.mjs
          node --check server/route-limits.mjs
          node --check server/observability.mjs
          node --check server/postgres-sync.mjs

      - name: Build PostgreSQL smoke image
        run: docker build --target runner --tag submundo808-pg-smoke .

      - name: Test PostgreSQL initialization and API against isolated empty database
        env:
          PG_TEST_DATABASE_URL: postgresql://submundo_ci:ci_password@127.0.0.1:5432/submundo_test
        run: |
          set -euo pipefail
          docker run --rm -d --name submundo808-pg-smoke --network host \
            -e DATABASE_URL="$PG_TEST_DATABASE_URL" \
            -e APP_ENV=production -e AUTO_SEED_DEMO=false \
            -e PORT=18080 -e DATA_DIR=/tmp/submundo-ci \
            submundo808-pg-smoke
          trap 'docker logs submundo808-pg-smoke || true; docker rm -f submundo808-pg-smoke || true' EXIT
          ready=false
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:18080/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          PG_TEST_CONTAINER=submundo808-pg-smoke \
            PG_TEST_BASE_URL=http://127.0.0.1:18080 \
            node --test tests/postgres-integration.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Dokploy (if webhook configured)
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_PROD }}
        if: env.DOKPLOY_WEBHOOK != ''
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 10 --max-time 45 \
            --retry 3 --retry-delay 3 \
            -X POST "$DOKPLOY_WEBHOOK"
