name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: submundo-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Auditoria incremental: reportar débitos legados sem quebrar o POC atual.
      - name: Audit frontend types (baseline)
        continue-on-error: true
        run: pnpm --filter @workspace/submundo-808 typecheck

      - name: Run critical regression tests
        run: node --test tests/auth.test.mjs tests/request-security.test.mjs tests/location-sharing.test.mjs tests/demo-auto-seed.test.mjs tests/notification-delivery.test.mjs tests/health.test.mjs tests/accent-contrast.test.mjs tests/notification-map-focus.test.mjs

      - name: Audit full test suite (baseline)
        continue-on-error: true
        run: node --test tests/*.test.mjs

      - name: Check backend syntax
        run: |
          node --check server/index.mjs
          node --check server/auth.mjs
          node --check server/request-security.mjs
          node --check server/oauth.mjs
          node --check server/health.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Dokploy (if webhook configured)
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_PROD }}
        if: env.DOKPLOY_WEBHOOK != ''
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 10 --max-time 45 \
            --retry 3 --retry-delay 3 \
            -X POST "$DOKPLOY_WEBHOOK"
