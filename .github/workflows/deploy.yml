name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: submundo-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish GHCR
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: submundo_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: submundo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U submundo_ci -d submundo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Auditoria incremental: reportar débitos legados sem quebrar o POC atual.
      - name: Audit frontend types (baseline)
        continue-on-error: true
        run: pnpm --filter @workspace/submundo-808 typecheck

      - name: Run critical regression tests
        run: node --test tests/auth.test.mjs tests/request-security.test.mjs tests/location-sharing.test.mjs tests/demo-auto-seed.test.mjs tests/notification-delivery.test.mjs tests/health.test.mjs tests/accent-contrast.test.mjs tests/notification-map-focus.test.mjs tests/security-ops.test.mjs tests/privacy-notices.test.mjs tests/postgres-sync.test.mjs tests/real-tour-reset.test.mjs tests/real-tour-seed.test.mjs tests/public-event-navigation.test.mjs tests/native-confirmations.test.mjs tests/crowd-analytics.test.mjs tests/database-mode.test.mjs tests/event-edit-extras.test.mjs tests/entity-crud-ui.test.mjs tests/venue-address.test.mjs tests/notification-edit-hydration.test.mjs tests/map-marker-edit-hydration.test.mjs tests/venue-analysis-production-ui.test.mjs

      - name: Audit full test suite (baseline)
        continue-on-error: true
        run: node --test tests/*.test.mjs

      - name: Check backend syntax
        run: |
          node --check server/index.mjs
          node --check server/auth.mjs
          node --check server/request-security.mjs
          node --check server/oauth.mjs
          node --check server/health.mjs
          node --check server/route-limits.mjs
          node --check server/observability.mjs
          node --check server/postgres-sync.mjs

      - name: Compile participant frontend (required)
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build

      - name: Build PostgreSQL smoke image
        run: docker build --target runner --tag submundo808-pg-smoke .

      - name: Refuse SQLite fallback when production DATABASE_URL is missing
        run: |
          set -euo pipefail
          if docker run --rm --network none \
             -e NODE_ENV=production -e APP_ENV=production \
             -e DATA_DIR=/tmp/submundo-prod-guard submundo808-pg-smoke \
             > /tmp/submundo-prod-guard.log 2>&1; then
            echo "ERROR: production started without PostgreSQL"
            exit 1
          fi
          grep -q "SQLite está desabilitado" /tmp/submundo-prod-guard.log

      - name: Test PostgreSQL initialization and API against isolated empty database
        env:
          PG_TEST_DATABASE_URL: postgresql://submundo_ci:ci_password@127.0.0.1:5432/submundo_test
        run: |
          set -euo pipefail
          docker run --rm -d --name submundo808-pg-smoke --network host \
            -e DATABASE_URL="$PG_TEST_DATABASE_URL" \
            -e APP_ENV=production -e AUTO_SEED_DEMO=false \
            -e PORT=18080 -e DATA_DIR=/tmp/submundo-ci \
            submundo808-pg-smoke
          trap 'docker logs submundo808-pg-smoke || true; docker rm -f submundo808-pg-smoke || true' EXIT
          ready=false
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:18080/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          PG_TEST_CONTAINER=submundo808-pg-smoke \
            PG_TEST_BASE_URL=http://127.0.0.1:18080 \
            node --test tests/postgres-integration.test.mjs

      - name: Verify one-time PostgreSQL catalog reset preserves social and notifications
        env:
          PG_TEST_DATABASE_URL: postgresql://submundo_ci:ci_password@127.0.0.1:5432/submundo_test
        run: |
          set -euo pipefail
          # The previous smoke left a registered user and a manually created event.
          # Add an actual group and notification linked to that old event.
          docker run --rm -i --network host \
            -e DATABASE_URL="$PG_TEST_DATABASE_URL" --entrypoint node \
            submundo808-pg-smoke --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {PostgresSync} from '/app/server/postgres-sync.mjs';
          const db=new PostgresSync(process.env.DATABASE_URL);
          const user=db.prepare('SELECT id FROM users LIMIT 1').get();
          const old=db.prepare("SELECT id FROM events WHERE name='Evento Teste PG'").get();
          assert.ok(user&&old,'Previous PostgreSQL integration must have created a user and event');
          db.prepare('INSERT INTO friend_groups(id,owner_id,name,invite_hash,created_at) VALUES(?,?,?,?,?)').run('pg-preserved-group',user.id,'Grupo que permanece','pg-group-code',Date.now());
          db.prepare("INSERT INTO friend_group_members(group_id,user_id,role,joined_at) VALUES(?,?,'owner',?)").run('pg-preserved-group',user.id,Date.now());
          db.prepare("INSERT INTO notifications(id,event_id,title,body,kind,target_kind,target_id,audience,status,scheduled_at,created_by,created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)").run('pg-old-notification',old.id,'Aviso antigo','Preservar histórico','info','event',old.id,'event','scheduled',Date.now()+60000,user.id,Date.now());
          db.prepare('INSERT INTO notification_receipts(notification_id,user_id) VALUES(?,?)').run('pg-old-notification',user.id);
          db.close();
          JS

          docker run --rm -d --name submundo808-pg-reset --network host \
            -e DATABASE_URL="$PG_TEST_DATABASE_URL" -e APP_ENV=production \
            -e AUTO_SEED_DEMO=true -e PORT=18081 -e DATA_DIR=/tmp/submundo-reset-ci \
            submundo808-pg-smoke
          trap 'docker logs submundo808-pg-reset || true; docker rm -f submundo808-pg-reset || true' EXIT
          ready=false
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:18081/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true

          docker run --rm -i --network host \
            -e DATABASE_URL="$PG_TEST_DATABASE_URL" --entrypoint node \
            submundo808-pg-smoke --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {PostgresSync} from '/app/server/postgres-sync.mjs';
          const db=new PostgresSync(process.env.DATABASE_URL);
          const n=table=>Number(db.prepare('SELECT COUNT(*) n FROM '+table).get().n);
          assert.equal(n('events'),8);
          assert.equal(n('venues'),8);
          assert.equal(n('event_maps'),8);
          assert.equal(n('products'),12);
          assert.equal(n('event_participants'),0);
          assert.equal(n('event_reviews'),0);
          assert.ok(n('users')>=1);
          assert.equal(n('friend_groups'),1);
          assert.equal(n('friend_group_members'),1);
          assert.equal(n('notifications'),1);
          assert.equal(n('notification_receipts'),1);
          assert.equal(db.prepare('SELECT status FROM notifications WHERE id=?').get('pg-old-notification').status,'cancelled');
          assert.equal(db.prepare('SELECT 1 FROM events WHERE name=?').get('Evento Teste PG'),undefined);
          assert.ok(db.prepare('SELECT value FROM app_settings WHERE key=?').get('meaple808-clean-initialization-v1'));
          db.prepare('UPDATE events SET name=? WHERE id=?').run('Persistiu após reinício','meaple-808-event-brasilia-2026-10-31');
          db.close();
          JS

          docker restart submundo808-pg-reset
          ready=false
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:18081/api/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker run --rm -i --network host \
            -e DATABASE_URL="$PG_TEST_DATABASE_URL" --entrypoint node \
            submundo808-pg-smoke --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {PostgresSync} from '/app/server/postgres-sync.mjs';
          const db=new PostgresSync(process.env.DATABASE_URL);
          assert.equal(db.prepare('SELECT name FROM events WHERE id=?').get('meaple-808-event-brasilia-2026-10-31').name,'Persistiu após reinício');
          assert.equal(Number(db.prepare('SELECT COUNT(*) n FROM events').get().n),8);
          assert.equal(Number(db.prepare('SELECT COUNT(*) n FROM friend_groups').get().n),1);
          db.close();
          JS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Dokploy (if webhook configured)
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_PROD }}
        if: env.DOKPLOY_WEBHOOK != ''
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 10 --max-time 45 \
            --retry 3 --retry-delay 3 \
            -X POST "$DOKPLOY_WEBHOOK"
