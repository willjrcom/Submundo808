name: Validate groups and event reviews (temporary)
on:
  push:
    branches:
      - fix/groups-header-review-status
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify regressions
        run: node --test tests/group-review-status.test.mjs tests/review-once.test.mjs tests/admin-dashboard-reviews.test.mjs tests/notification-delivery.test.mjs
      - name: Verify backend syntax
        run: node --check server/index.mjs
      - name: Build frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
