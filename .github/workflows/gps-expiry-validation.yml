name: Validate GPS sharing expiry regression (temporary)
on:
  push:
    branches:
      - fix/gps-sharing-expiry-no-restart
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: GPS privacy and offline regression
        run: node --test tests/gps-default-friend-sharing.test.mjs tests/location-sharing-ui.test.mjs tests/location-permission.test.mjs tests/participant-offline-pwa.test.mjs tests/participant-map-first.test.mjs
      - name: Typecheck
        run: pnpm --filter @workspace/submundo-808 typecheck
      - name: Build
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
