name: Validate map calibration UX (temporary)
on:
  push:
    branches:
      - feature/map-calibration-overview-orientation
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Map calibration regression
        run: node --test tests/map-calibration-flow.test.mjs tests/map-calibration-guidance.test.mjs tests/map-calibration-manual.test.mjs tests/map-area-editor.test.mjs tests/map-area-shapes.test.mjs
      - name: Compile frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
