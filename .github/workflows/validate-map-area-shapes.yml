name: Validate grouped area map geometry
on:
  push:
    branches: [qa-map-shapes-20261106]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/submundo-808 typecheck
      - run: node --test tests/map-area-shapes.test.mjs tests/map-area-editor.test.mjs tests/map-layout-geometry.test.mjs tests/map-frame-geometry.test.mjs tests/map-label-layout.test.mjs
      - run: node --check server/index.mjs && node --check server/map-area-geometry.mjs
      - name: Diagnose production container boot without DATABASE_URL
        run: |
          docker build --target runner --tag submundo808-smoke-debug .
          docker run --rm --network none -e NODE_ENV=production -e APP_ENV=production -e DATA_DIR=/tmp/submundo-prod-guard submundo808-smoke-debug > /tmp/submundo-prod-debug.log 2>&1 || true
          sed -n '1,50p' /tmp/submundo-prod-debug.log
