name: Validate single GPS and default friend sharing (temporary)
on:
  push:
    branches:
      - feat/single-gps-share-optout-permissions
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate privacy, GPS, offline and map regressions
        run: node --test tests/gps-default-friend-sharing.test.mjs tests/location-sharing-ui.test.mjs tests/location-permission.test.mjs tests/gps-acquisition.test.mjs tests/location-sharing.test.mjs tests/participant-map-first.test.mjs tests/participant-offline-pwa.test.mjs tests/participant-full-offline.test.mjs tests/ios-installation-permissions.test.mjs tests/crowd-analytics.test.mjs tests/off-map-indicator.test.mjs tests/map-location-utils.test.mjs
      - name: Typecheck participant frontend
        run: pnpm --filter @workspace/submundo-808 typecheck
      - name: Validate backend syntax
        run: node --check server/index.mjs && node --check server/postgres-sync.mjs && node --check artifacts/submundo-808/public/sw.js
      - name: Compile participant frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
      - name: Check offline PWA assets
        run: |
          test -s artifacts/submundo-808/dist/public/offline-assets.json
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('artifacts/submundo-808/dist/public/offline-assets.json'));if(!m.version||!m.assets.includes('./index.html')||!m.assets.some(x=>x.endsWith('.js')))process.exit(1);"
