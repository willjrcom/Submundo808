name: Validate group invitation modal (temporary)
on:
  push:
    branches:
      - fix/group-invite-as-modal
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Group UI and social regression
        run: node --test tests/group-invite-modal.test.mjs tests/group-review-status.test.mjs tests/social.test.mjs
      - name: Compile frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
