name: Validate map-first participant and privacy permissions (temporary)
on:
  push:
    branches:
      - fix/participant-map-first-and-analytics-permissions
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Map, location, privacy and permissions regressions
        run: node --test tests/participant-map-first.test.mjs tests/location-sharing-ui.test.mjs tests/location-permission.test.mjs tests/privacy-notices.test.mjs tests/off-map-indicator.test.mjs tests/crowd-analytics.test.mjs tests/ios-installation-permissions.test.mjs
      - name: Build frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
