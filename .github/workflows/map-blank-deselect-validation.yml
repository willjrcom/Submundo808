name: Validate map blank-grid deselection (temporary)
on:
  push:
    branches:
      - fix/map-empty-cartesian-deselect
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Map editor regression
        run: node --test tests/map-editor-mobile-interactions.test.mjs tests/map-area-editor.test.mjs tests/map-area-shapes.test.mjs tests/map-editor-curve-preview.test.mjs
      - name: Build frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
