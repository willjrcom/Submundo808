name: Validate admin UI changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-ui:
    name: Test admin UI and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test map dialogs, event menu routing and existing admin regressions
        run: |
          node --test \
            tests/admin-access.test.mjs \
            tests/admin-access-ui.test.mjs \
            tests/admin-notification-select-ux.test.mjs \
            tests/notification-delivery.test.mjs \
            tests/admin-company-profile.test.mjs \
            tests/login-back-admin-test.test.mjs \
            tests/group-invite-auth-resume.test.mjs \
            tests/social.test.mjs \
            tests/participant-event-home-tabs.test.mjs \
            tests/gps-default-friend-sharing.test.mjs \
            tests/location-sharing.test.mjs \
            tests/privacy-notices.test.mjs \
            tests/ios-installation-permissions.test.mjs \
            tests/permission-flows.test.mjs \
            tests/crowd-analytics.test.mjs \
            tests/participant-public-copy-gps-cta.test.mjs \
            tests/public-event-agenda.test.mjs \
            tests/public-event-navigation.test.mjs \
            tests/event-location-default-menu-route.test.mjs \
            tests/admin-map-modals-menu-page.test.mjs \
            tests/admin-route.test.mjs \
            tests/admin-dashboard-routing.test.mjs \
            tests/admin-event-dashboard.test.mjs \
            tests/admin-venue-dashboard.test.mjs \
            tests/admin-venue-maps.test.mjs \
            tests/map-editor-error-recovery.test.mjs \
            tests/map-area-editor.test.mjs \
            tests/entity-crud-ui.test.mjs \
            tests/event-save-validation.test.mjs \
            tests/event-usage.test.mjs \
            tests/telemetry-dashboard.test.mjs
      - name: Check backend syntax
        run: node --check server/index.mjs
      - name: Typecheck frontend
        run: pnpm --filter @workspace/submundo-808 typecheck
      - name: Build frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
