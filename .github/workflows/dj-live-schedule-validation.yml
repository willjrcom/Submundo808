name: Validate DJ live schedule and midnight rollover (temporary)
on:
  push:
    branches:
      - feat/dj-schedule-live-highlight
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: DJ schedule, event and offline tests
        run: node --test tests/dj-schedule-live.test.mjs tests/event-save-validation.test.mjs tests/public-event-navigation.test.mjs tests/admin-event-dashboard.test.mjs tests/participant-offline-pwa.test.mjs
      - name: Typecheck client
        run: pnpm --filter @workspace/submundo-808 typecheck
      - name: Build frontend
        env:
          PORT: '3000'
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/submundo-808 build
      - name: Validate offline assets list
        run: |
          test -s artifacts/submundo-808/dist/public/offline-assets.json
          node --check server/index.mjs
